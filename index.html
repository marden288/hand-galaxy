<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hand Galaxy</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div id="interface">

        <div class="title">
            HAND GALAXY
        </div>

        <div class="subtitle">
            PYTHON × MEDIAPIPE × THREE.JS
        </div>

        <div id="status">
            CONNECTING...
        </div>

        <div class="controls">

            <div>
                <span>✋</span>
                Move Hand
                <small>Rotate / Tilt</small>
            </div>

            <div>
                <span>🤏</span>
                Pinch
                <small>Black Hole</small>
            </div>

            <div>
                <span>✊</span>
                Fist
                <small>Freeze</small>
            </div>

            <div>
                <span>👐</span>
                Two Hands
                <small>Expand Galaxy</small>
            </div>

        </div>

    </div>

    <script
        type="module"
        src="main.js"
    ></script>

</body>

</html>
